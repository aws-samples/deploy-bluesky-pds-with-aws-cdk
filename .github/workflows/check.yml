on:
  [pull_request, push]

name: Check

jobs:
  images:
    name: Docker Images Build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      # Set up with guides/github-actions-authentication.yaml. The secret is not
      # available to pull requests from forks, so those fall back to anonymous pulls.
      ECR_PUBLIC_ROLE_ARN: ${{ secrets.ECR_PUBLIC_ROLE_ARN }}
    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-node@v3
      with:
        node-version: 20
    - name: Configure AWS credentials
      if: env.ECR_PUBLIC_ROLE_ARN != ''
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ env.ECR_PUBLIC_ROLE_ARN }}
        aws-region: us-east-1
    - name: Log in to Amazon ECR Public
      # Authenticated pulls get a higher quota than anonymous pulls
      if: env.ECR_PUBLIC_ROLE_ARN != ''
      uses: aws-actions/amazon-ecr-login@v2
      with:
        registry-type: public
    - name: Pull base images
      # public.ecr.aws rate-limits anonymous pulls from shared runner IPs
      # (429 toomanyrequests), so retry pulling the FROM images before building.
      # docker build then uses the local copies instead of pulling again.
      run: |
        for image in $(awk 'toupper($1) == "FROM" {print $2}' infra/pds/Dockerfile infra/pds-litestream/Dockerfile infra/pds-s3-file-sync/Dockerfile | sort -u); do
          for attempt in 1 2 3 4 5; do
            docker pull "$image" && continue 2
            echo "Pull of $image failed (attempt $attempt of 5)"
            [ "$attempt" -lt 5 ] && sleep $((attempt * 15))
          done
          exit 1
        done
    - name: Test
      run: |
        cd infra
        docker build pds/
        docker build pds-litestream/
        docker build pds-s3-file-sync/

  infra:
    name: Infra CDK Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-node@v3
      with:
        node-version: 20
    - name: Test
      run: |
        cd infra

        npm install -g aws-cdk
        npm ci

        npm run build

  pipeline:
    name: Pipeline CDK Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-node@v3
      with:
        node-version: 20
    - name: Test
      run: |
        cd pipeline

        npm install -g aws-cdk
        npm ci

        npm run build
        cdk synth --app 'node pipeline.js'
